name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / SDK from global.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      AVALONIA_TELEMETRY_OPTOUT: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore OmniBrille.sln

      - name: Verify formatting
        run: dotnet format OmniBrille.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build OmniBrille.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test OmniBrille.sln --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: .\build\Test-NuGetVulnerabilities.ps1

      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\Package-Windows.ps1 -BootstrapInnoSetup

      - name: Retain private Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: OmniBrille-windows-installer
          path: |
            artifacts/packages/OmniBrille-*-win-x64-setup.exe
            artifacts/packages/OmniBrille-*-win-x64-setup.exe.sha256
            artifacts/packages/OmniBrille-*-win-x64-setup-manifest.json
            artifacts/packages/OmniBrille-*-win-x64-setup-dependencies.json
          if-no-files-found: error
          retention-days: 14
